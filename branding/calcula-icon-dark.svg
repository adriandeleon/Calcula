<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Calcula">
  <title>Calcula</title>
  <desc>An integral operating on a small stack of terms.</desc>
  <!--
    The accented rule is the BOTTOM one, because Calcula draws stack entry 1: (the top of
    the stack) nearest the input. Two muted rules and one heavy accent, never three equal
    bars: equal bars read as lines of text, which is what the first mark got wrong.

    Palette: Rule and Plate. Graphite #e4e8ee, muted #5c6472, azure #6ba6e8.

    The integral is SET, not drawn, so this master needs a math font installed. Convert it
    to outlines before shipping any context that renders SVG directly (Inkscape's
    export-text-to-path, or FontForge). The generated PNGs carry no font dependency and
    are what the app loads via stage.getIcons().
  -->
  <text x="4" y="44.5" font-size="48" fill="#e4e8ee"
        font-family="STIX Two Math, STIX Two Text, Cambria Math, Latin Modern Math, Iowan Old Style, Palatino, Georgia, serif">&#8747;</text>
  <rect x="40" y="20" width="18" height="3.5" rx="1.75" fill="#5c6472"/>
  <rect x="40" y="28" width="12" height="3.5" rx="1.75" fill="#5c6472"/>
  <rect x="40" y="36" width="21" height="6"   rx="3"    fill="#6ba6e8"/>
</svg>
